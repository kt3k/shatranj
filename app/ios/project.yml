# XcodeGen spec for the Shatranj iOS app: `xcodegen generate`.
# Build the web app first (`deno task build` at the repository root): the
# app bundles ../../dist and serves it as app://localhost/ through gawa.
name: Shatranj
options:
  bundleIdPrefix: io.github.kt3k
  deploymentTarget:
    iOS: "15.0"
packages:
  Gawa:
    url: https://github.com/kt3k/gawa
    revision: 538ee451fd1e46b047d9490937318ae6bf9959f3
targets:
  Shatranj:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [PrivacyInfo.xcprivacy]
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../dist
        type: folder
        buildPhase: resources
    dependencies:
      - package: Gawa
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Shatranj
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # navigator.languages in WKWebView follows the app's localizations.
        CFBundleLocalizations: [en, ja, ar, fa, es, de, fr, ru, tr, zh-Hans, ko]
        CFBundleDevelopmentRegion: en
        # No encryption beyond what the OS provides (no network at all).
        ITSAppUsesNonExemptEncryption: false
        # "Open in Shatranj" for .pgn files (imported into the records).
        CFBundleDocumentTypes:
          - CFBundleTypeName: PGN chess game
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [io.github.kt3k.shatranj.pgn]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.kt3k.shatranj.pgn
            UTTypeDescription: PGN chess game
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [pgn]
              public.mime-type: [
                application/x-chess-pgn,
                application/vnd.chess-pgn,
              ]
        # Opened files are copied in, not edited in place.
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
    settings:
      base:
        # Change to your own identifier and set DEVELOPMENT_TEAM to run on
        # a device (Xcode → Signing & Capabilities).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kt3k.shatranj
        # Sources/Assets.xcassets (rendered from design/app-icon.svg).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
