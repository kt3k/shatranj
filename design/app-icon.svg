  <circle cx="74.749" cy="74.749" r="6.5" fill="url(#gold)" />
  <circle cx="25.251" cy="74.749" r="6.5" fill="url(#gold)" />
  <circle cx="25.251" cy="25.251" r="6.5" fill="url(#gold)" />
  <circle cx="74.749" cy="25.251" r="6.5" fill="url(#gold)" />
