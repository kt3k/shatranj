<!-- Shatranj app icon: the Round City of Baghdad (four gates, outer
     wall) around a shatranj board. Master for every app icon size; see
     docs/app-packaging.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024"
  height="1024">
  <defs>
    <radialGradient id="night" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1D2744" />
      <stop offset="1" stop-color="#070B16" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C76A" />
      <stop offset="1" stop-color="#B07A22" />
