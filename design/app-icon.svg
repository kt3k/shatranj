    <rect x="34" y="42" width="8" height="8" fill="#141826" />
    <rect x="34" y="50" width="8" height="8" fill="#FAF5EB" />
    <rect x="34" y="58" width="8" height="8" fill="#141826" />
    <rect x="42" y="34" width="8" height="8" fill="#141826" />
    <rect x="42" y="42" width="8" height="8" fill="#FAF5EB" />
    <rect x="42" y="50" width="8" height="8" fill="#141826" />
    <rect x="42" y="58" width="8" height="8" fill="#FAF5EB" />
    <rect x="50" y="34" width="8" height="8" fill="#FAF5EB" />
    <rect x="50" y="42" width="8" height="8" fill="#141826" />
    <rect x="50" y="50" width="8" height="8" fill="#FAF5EB" />
    <rect x="50" y="58" width="8" height="8" fill="#141826" />
