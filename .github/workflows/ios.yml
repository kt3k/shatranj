name: ios app

on:
  push:
    branches: [main]
    paths: ["app/ios/**", "src/**", "static/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["app/ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install && deno task build
      - name: Build the app (iOS Simulator)
        working-directory: app/ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Shatranj.xcodeproj -scheme Shatranj \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet
