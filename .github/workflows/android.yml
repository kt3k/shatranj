name: android app

# Builds the Android app shell (app/android) and uploads a debug-signed
# Shatranj.apk that can be installed directly (see docs/app-packaging.md).

on:
  push:
    branches: [main]
    paths:
      - "app/android/**"
      - "src/**"
      - "static/**"
      - "scripts/**"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths: ["app/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deno.land/install.sh downloads from dl.deno.land, not GitHub releases.
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y --no-modify-path
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - run: deno install && deno task build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (debug APK)
        working-directory: app/android
        run: ./gradlew assembleDebug --console=plain
      - name: Collect Shatranj.apk
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/Shatranj.apk
          ls -l out/Shatranj.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Shatranj-apk-${{ github.sha }}
          path: out/Shatranj.apk
          retention-days: 30
          if-no-files-found: error
      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ### Shatranj.apk (debug-signed)

          Download the artifact below, unzip it and open `Shatranj.apk` on an
          Android device (allow installing from this source when asked), or
          run `adb install Shatranj.apk`. See `docs/app-packaging.md`.
          MD
